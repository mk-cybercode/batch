name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/investor-deck-url-ackodl, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Publish the static export to the gh-pages branch. GitHub serves it at
      # https://<owner>.github.io/batch/ (Settings → Pages → deploy from
      # branch gh-pages, auto-enabled when the branch first appears).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
